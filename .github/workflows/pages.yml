# Pubblica site/ su GitHub Pages dal branch di default. I dati in site/data/ sono generati da
# scripts/make_report.py e versionati, così il sito mostra esattamente i risultati della sintesi.
name: Pages

on:
  push:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Copia locale di Plotly (niente dipendenza da CDN a runtime)
        run: |
          npm pack --silent plotly.js-dist-min@2.35.2
          mkdir -p site/vendor
          tar -xzf plotly.js-dist-min-2.35.2.tgz -O package/plotly.min.js > site/vendor/plotly.min.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
