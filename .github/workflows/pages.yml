# Pubblica site/ (e l'articolo compilato, site/paper.pdf) su GitHub Pages dal branch di default. I dati in site/data/ sono generati da
# scripts/make_report.py e versionati, così il sito mostra esattamente i risultati della sintesi.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Copia locale di Plotly (niente dipendenza da CDN a runtime)
        run: |
          npm pack --silent plotly.js-dist-min@2.35.2
          mkdir -p site/vendor
          tar -xzf plotly.js-dist-min-2.35.2.tgz -O package/plotly.min.js > site/vendor/plotly.min.js
      - name: Compila l'articolo
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
      - run: cp paper/main.pdf site/paper.pdf
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dopo il deploy apre il sito pubblicato in un browser headless e verifica pagine,
  # caricamento di Plotly, grafici con dati e animazione. Riprova finché il CDN si aggiorna.
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Verifica il sito pubblicato
        run: |
          for i in 1 2 3 4 5 6; do
            node scripts/verify_site.mjs "https://viciuslio.github.io/skill-cliff-abm/" && exit 0
            echo "Tentativo $i fallito, riprovo tra 20 s"; sleep 20
          done
          exit 1
