[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcliff"
version = "0.1.0"
description = "ABM della trasmissione di capitale umano tra senior e junior (skill cliff)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Mesa serve solo al gemello di verifica (docking); Mesa >= 3.4 richiede Python 3.12,
# su 3.11 si usa 3.3.1 (il gemello è testato con entrambe). Mesa 3.x importa networkx.
mesa = [
    "mesa==3.5.1; python_version >= '3.12'",
    "mesa==3.3.1; python_version < '3.12'",
    "networkx>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
