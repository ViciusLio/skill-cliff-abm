[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcliff"
version = "0.1.0"
description = "ABM della trasmissione di capitale umano tra senior e junior (skill cliff)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Mesa serve solo al gemello di verifica (docking); 3.5.x importa networkx.
mesa = ["mesa==3.5.1", "networkx>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
